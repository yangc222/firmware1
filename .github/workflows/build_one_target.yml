name: Build TinyLoRa-C3 Firmware

on:
  push:
    branches: [ "master", "main" ]  # 当你推送代码到这两个分支时触发
  workflow_dispatch:               # 允许你手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive    # 确保子模块也拉取下来

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Compile Firmware
        run: pio run -e tinylora_v1

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: tinylora-c3-firmware
          path: .pio/build/tinylora_v1/firmware.bin
